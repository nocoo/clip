# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, L1, L2, Z1 via quality.yml;
# na L1.5, L3, P1; todo B1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, strict slot-status.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.3.5"
      install-policy: blocked
      coverage-path: coverage
      test-command: bun run test:unit
      lint-command: bun run lint
      typecheck-command: bun run typecheck
      gitleaks-config: .gitleaks.toml
      workflow-lint: true
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:e2e
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "todo", "reason": "packages/web Astro 文档站构建尚未接入 CI"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "非 Cloudflare Worker 项目，无 workerd/miniflare 运行时测试"},
        "L2": {"status": "impl"},
        "L3": {"status": "na", "reason": "无 Playwright 浏览器 E2E；文档站关键路径浏览器验收尚未实现"},
        "P1": {"status": "na", "reason": "根 package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
